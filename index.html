<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Fitaa Digital — Pure. Strategic. Impactful.</title>
    <meta name="description" content="Fitaa Digital is a premium creative and digital marketing agency in Accra, Ghana. We specialise in LED billboard campaigns, graphic design, campaign landing pages, and full digital marketing." />
    <meta name="keywords" content="digital agency accra, billboard advertising ghana, graphic design accra, digital marketing ghana, LED billboard campaigns, landing pages ghana, Fitaa Digital" />
    <meta name="author" content="Fitaa Digital" />
    <link rel="canonical" href="https://fitaadigital.vercel.app/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://fitaadigital.vercel.app/" />
    <meta property="og:title"       content="Fitaa Digital — Pure. Strategic. Impactful." />
    <meta property="og:description" content="Premium creative and digital marketing agency in Accra. LED billboard campaigns, graphic design, campaign landing pages, and digital marketing." />
    <meta property="og:image"       content="https://fitaadigital.vercel.app/og-image.jpg" />
    <meta property="og:locale"      content="en_GH" />
    <meta property="og:site_name"   content="Fitaa Digital" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Fitaa Digital — Pure. Strategic. Impactful." />
    <meta name="twitter:description" content="Premium creative and digital marketing agency in Accra. LED billboard campaigns, graphic design, landing pages, digital marketing." />
    <meta name="twitter:image"       content="https://fitaadigital.vercel.app/og-image.jpg" />

    <!-- Favicon -->
    <meta name="theme-color" content="#090e12" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon"      href="/logo.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Fitaa Digital",
      "description": "Premium creative and digital marketing agency in Accra, Ghana.",
      "url": "https://fitaadigital.vercel.app",
      "logo": "https://fitaadigital.vercel.app/logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Accra",
        "addressCountry": "GH"
      },
      "sameAs": [
        "https://www.behance.net/crea8",
        "https://www.instagram.com/fitaacreative"
      ],
      "serviceType": [
        "LED Billboard Advertising",
        "Graphic Design",
        "Campaign Landing Pages",
        "Digital Marketing"
      ]
    }
    </script>
    <!-- Splash: shown once per visit, ~0.6s, skipped for reduced motion -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#090e12;transition:opacity .32s ease,visibility .32s}
      #splash.out{opacity:0;visibility:hidden}
      .no-splash #splash{display:none}
      .sp-mark{position:relative;width:76px;height:76px;animation:sp-in .55s cubic-bezier(.22,1,.36,1) both}
      .sp-mark img{width:100%;height:100%;border-radius:14px;display:block}
      .sp-ring{position:absolute;inset:-14px;border-radius:24px;padding:1.5px;background:conic-gradient(from 0deg,transparent 0 55%,#00ddff 78%,#e8be62 92%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sp-spin .9s linear infinite}
      .sp-glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,221,255,.28),transparent);animation:sp-in .6s ease both}
      @keyframes sp-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
      @keyframes sp-spin{to{transform:rotate(1turn)}}
    </style>
    <script>
      (function(){var d=document.documentElement;try{if(sessionStorage.getItem("fitaa-splash")||matchMedia("(prefers-reduced-motion: reduce)").matches||/^\/(privacy|terms)/.test(location.pathname)){d.classList.add("no-splash")}else{sessionStorage.setItem("fitaa-splash","1")}}catch(e){d.classList.add("no-splash")}
      window.__hideSplash=function(){var el=document.getElementById("splash");if(!el||el.classList.contains("out"))return;var wait=Math.max(0,600-performance.now());setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove()},400)},wait)};
      setTimeout(function(){window.__hideSplash()},2500);})();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="sp-mark"><span class="sp-glow"></span><span class="sp-ring"></span><img src="/logo.png" alt="" width="76" height="76" /></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
