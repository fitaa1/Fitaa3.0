    <!-- Theme: applied before first paint so there is no light/dark flash -->
    <script>
      (function(){var d=document.documentElement,t=null;try{t=localStorage.getItem("fitaa-theme-v2")}catch(e){}
      var dark=t?t==="dark":window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
      if(dark)d.classList.add("dark");d.style.colorScheme=dark?"dark":"light";})();
    </script>
    <!-- Splash: one 0.5 s pulse of the logo on the first visit of a session, then the logo opens into the page.
         Skipped for reduced motion and on /privacy, /terms. Transform and opacity only. -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:hsl(210 30% 98%);transition:opacity .34s cubic-bezier(.4,0,.2,1),visibility .34s}
      #splash.out{opacity:0;visibility:hidden}
      .dark #splash{background:#090e12}
      .no-splash #splash{display:none}
      .sp-mark{position:relative;width:112px;height:112px;opacity:0;transition:transform .34s cubic-bezier(.4,0,.2,1)}
      .sp-mark.go{opacity:1}
      .sp-mark:not(.go) *{animation-play-state:paused}
      #splash.out .sp-mark{transform:scale(1.14)}
      .sp-mark img{position:relative;width:100%;height:100%;border-radius:22px;display:block;box-shadow:0 18px 50px -12px rgba(0,120,255,.45);animation:sp-beat .5s cubic-bezier(.22,1,.36,1) both}
      .sp-glow{position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,221,255,.30),rgba(0,120,255,.10) 55%,transparent);animation:sp-glow .5s ease-out both}
      .sp-ring{position:absolute;inset:-6px;border-radius:28px;padding:2px;background:linear-gradient(135deg,#00ddff,#3b82f6 45%,#e8be62);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sp-ring .5s cubic-bezier(.22,1,.36,1) .06s both}
      @keyframes sp-beat{0%{opacity:0;transform:scale(.88)}45%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
      @keyframes sp-ring{0%{opacity:0;transform:scale(.92)}22%{opacity:.95;transform:scale(1.02)}100%{opacity:0;transform:scale(1.75)}}
      @keyframes sp-glow{0%{opacity:0;transform:scale(.7)}50%{opacity:1}100%{opacity:.85;transform:scale(1)}}
    </style>
    <script>
      (function(){var d=document.documentElement;try{if(sessionStorage.getItem("fitaa-splash")||matchMedia("(prefers-reduced-motion: reduce)").matches||/^\/(privacy|terms)/.test(location.pathname)){d.classList.add("no-splash")}else{sessionStorage.setItem("fitaa-splash","1");var l=document.createElement("link");l.rel="preload";l.as="image";l.href="/logo-224.webp";l.fetchPriority="high";document.head.appendChild(l)}}catch(e){d.classList.add("no-splash")}
      window.__spGo=function(m){m.classList.add("go");window.__spT0=performance.now()};
      window.__hideSplash=function(){var el=document.getElementById("splash");if(!el||el.classList.contains("out"))return;var wait=window.__spT0?Math.max(0,520-(performance.now()-window.__spT0)):0;setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove()},400)},wait)};
      setTimeout(function(){window.__hideSplash()},2500);})();
    </script>
