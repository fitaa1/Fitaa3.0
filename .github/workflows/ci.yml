# Runs on every push to every branch. A red X on a pull request means do not merge.
# 1. The site must typecheck, build and pass its tests.
# 2. Every built page must pass the page check (scripts/check-pages.mjs): no sideways scroll,
#    console error, image without alt text, tap target under 44 px, phone menu that does not
#    open fully or first load over the budget, at 390, 820 and 1440 px in light and dark.
name: CI

# It runs on every push to every branch, so Qwen can push, read the result and fix until green
# without waiting for Claude (QWEN.md, Verification and reporting).
# Every pull request's notes are checked against the shared template, and its commits for co-author lines
# (the notes job, Nigel 19 Nov 2026), so that rule is held by a check, not only by words (Nigel, 22 Nov: learn how to learn).
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-test-and-page-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install the browser for the page check
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Page check
        run: npm run check:pages
        env:
          SHOTS: "1"
      - name: Keep the screenshots for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: shots
          retention-days: 7
          if-no-files-found: ignore

  notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Notes follow the template and no commit carries a co-author line
        env:
          BODY: ${{ github.event.pull_request.body }}
          COMMITS: ${{ github.event.pull_request.commits_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          for part in "## What changed" "## Checked" "## Not checked" "Generated by Fitaa"; do
            printf '%s\n' "$BODY" | grep -qF -- "$part" || { echo "The notes are missing: $part"; fail=1; }
          done
          if printf '%s\n' "$BODY" | grep -qiE -- "Co-Authored-By|Generated (by|with) \[?Claude Code"; then
            if ! printf '%s\n' "$BODY" | grep -qF -- "<!-- end of notes"; then echo "A Claude footer shows in the notes: end them with an unclosed <!-- end of notes"; fail=1; fi
          fi
          if gh api "$COMMITS" --paginate --jq '.[].commit.message' | grep -qi '^co-authored-by:'; then echo "A commit carries a co-author line"; fail=1; fi
          exit $fail
